services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bachat_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ../uploads:/app/uploads
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: bachat_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../uploads:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
